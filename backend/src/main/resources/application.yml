server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: stockflow-${APP_ROLE:all}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DB_USER:stockflow}
    password: ${DB_PASSWORD:local-stockflow}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  flyway:
    locations: classpath:db/common,classpath:db/${APP_ROLE:all}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      timeout: 250ms
      connect-timeout: 250ms
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: stockflow-${APP_ROLE:all}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    listener:
      ack-mode: record
  mail:
    host: ${MAIL_HOST:localhost}
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
    mail:
      enabled: false
app:
  role: ${APP_ROLE:all}
  messaging: ${MESSAGING:local}
  cache: ${CACHE_ENABLED:false}
  jwt-secret: ${JWT_SECRET}
  demo-password: ${DEMO_PASSWORD}
  seed: ${SEED_DEMO:true}
  cookie-secure: ${COOKIE_SECURE:false}
  reservation-seconds: ${RESERVATION_SECONDS:900}
  jobs: ${JOBS_ENABLED:true}
