limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 location /api/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://identity:8080; }
 location /api/catalog/ { proxy_pass http://catalog:8080; }
 location /api/inventory/ { proxy_pass http://inventory:8080; }
 location /api/orders { proxy_pass http://orders:8080; }
 location /api/fulfillment/ { proxy_pass http://fulfillment:8080; }
 location /api/ops/identity/ { proxy_pass http://identity:8080; }
 location /api/ops/catalog/ { proxy_pass http://catalog:8080; }
 location /api/ops/inventory/ { proxy_pass http://inventory:8080; }
 location /api/ops/orders/ { proxy_pass http://orders:8080; }
 location /api/ops/fulfillment/ { proxy_pass http://fulfillment:8080; }
 location /api/ops/notification/ { proxy_pass http://notification:8080; }
 location /actuator/ { return 404; }
 location / { try_files $uri $uri/ /index.html; }
}
